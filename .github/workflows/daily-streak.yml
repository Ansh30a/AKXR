
name: Daily GitHub Streak

on:
  schedule:
    # 9:00 AM IST every day
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-commit:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DAILY_COMMIT_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "Ansh30a"
          git config user.email "${{ secrets.GIT_AUTHOR_EMAIL }}"

      - name: Update daily activity log
        run: |
          mkdir -p .github
          touch .github/daily-streak.log

          TODAY=$(TZ=Asia/Kolkata date +%F)

          if ! grep -qx "$TODAY" .github/daily-streak.log; then
            echo "$TODAY" >> .github/daily-streak.log
          fi

      - name: Commit and push
        run: |
          git add .github/daily-streak.log

          if ! git diff --cached --quiet; then
            git commit -m "docs: update readme"
            git push origin HEAD:main
          fi
